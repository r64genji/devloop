<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>devloop | Your developer feed</title>
    <meta
      name="description"
      content="devloop: a developer news feed with tag-based tabs, a search palette, polls, bookmarks and a daily reading budget. Built with React and Tailwind CSS."
    />
    <meta name="theme-color" content="#FBF6EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1118" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Apply the saved theme before first paint so dark mode doesn't flash light -->
    <script>
      try {
        if (JSON.parse(localStorage.getItem("devloop:theme-dark"))) document.documentElement.classList.add("dark");
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
